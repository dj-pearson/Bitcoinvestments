# Cloudflare Worker for Google Indexing API
# Submits URLs to Google for faster indexing/crawling
#
# Required secrets (set in Cloudflare Dashboard):
# - GOOGLE_SERVICE_ACCOUNT_JSON (full service account JSON export)
# - SUPABASE_SERVICE_ROLE_KEY (for auth on manual triggers)

name = "google-indexing-worker"
main = "workers/google-indexing-worker.ts"
compatibility_date = "2024-11-20"

# Run daily at 6:00 AM UTC to re-submit key pages
# Google Indexing API quota: 200 URLs/day
[triggers]
crons = ["0 6 * * *"]

# Environment variables
[env.production]
vars = { PAGES_URL = "https://bitcoinvestments.net" }

[env.staging]
vars = { PAGES_URL = "https://staging.bitcoinvestments.net" }

# Required secrets (set in Cloudflare Dashboard):
# - GOOGLE_SERVICE_ACCOUNT_JSON
# - SUPABASE_SERVICE_ROLE_KEY
