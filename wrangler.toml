# - STRIPE_WEBHOOK_SECRET (whsec_xxxxx)
# - SUPABASE_SERVICE_ROLE_KEY (eyJhbGc...)
# - AMAZON_SMTP_USER_NAME (AWS SES SMTP username)
# - AMAZON_SMTP_PASSWORD (AWS SES SMTP password)
# - AMAZON_SMTP_ENDPOINT (email-smtp.us-east-1.amazonaws.com)
# - VITE_FROM_EMAIL (noreply@yourdomain.com)
# - CHAINABUSE_API_KEY (API key from https://chainabuse.com - get at profile > settings > API key)

# KV Namespaces for rate limiting
# Create these in Cloudflare Dashboard: Workers & Pages > KV > Create namespace
# Then bind them here with the namespace ID
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "your-kv-namespace-id-here"

# To create the KV namespace:
# 1. Go to Cloudflare Dashboard > Workers & Pages > KV
# 2. Click "Create a namespace"
# 3. Name it "rate-limit" or similar
# 4. Copy the ID and replace "your-kv-namespace-id-here" above
# 5. Uncomment the kv_namespaces section
