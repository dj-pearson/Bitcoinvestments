<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) with Consent Mode v2 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BLC0N9LCE5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // GDPR / ePrivacy: deny all tracking storage by default until the user
      // opts in via the cookie banner. No analytics/ads cookies are set until
      // consent is granted (Consent Mode v2).
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500
      });

      // Restore a returning visitor's saved choice before the first hit fires.
      try {
        var storedConsent = JSON.parse(
          window.localStorage.getItem('bitcoin_investments_cookie_consent') || 'null'
        );
        if (storedConsent) {
          gtag('consent', 'update', {
            analytics_storage: storedConsent.analytics ? 'granted' : 'denied',
            ad_storage: storedConsent.marketing ? 'granted' : 'denied',
            ad_user_data: storedConsent.marketing ? 'granted' : 'denied',
            ad_personalization: storedConsent.marketing ? 'granted' : 'denied'
          });
        }
      } catch (e) { /* ignore malformed consent */ }

      gtag('config', 'G-BLC0N9LCE5', { anonymize_ip: true });
    </script>

    <meta charset="UTF-8" />

    <!-- Preconnect to important domains for performance -->
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://api.coingecko.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.alternative.me" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bitcoinvestments" />

    <!--
      Site-wide defaults only. Everything page-specific - title, description,
      canonical, robots, Open Graph and JSON-LD - is set per route by <SEO> and
      written into each prerendered page at build time. Page-specific tags here
      would be served on every URL (this file used to ship the homepage's
      canonical, FAQ and a review rating on all of them).
    -->
    <title>Bitcoinvestments | Learn Crypto Investing for Beginners</title>
    <meta name="description" content="Learn to invest in Bitcoin and crypto safely: plain-English guides, exchange and wallet comparisons, free calculators and a scam checker." />
    <meta name="author" content="Bitcoinvestments" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Open Graph / Twitter defaults -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bitcoinvestments | Learn Crypto Investing for Beginners" />
    <meta property="og:description" content="Learn to invest in Bitcoin and crypto safely: plain-English guides, exchange and wallet comparisons, free calculators and a scam checker." />
    <meta property="og:image" content="https://bitcoinvestments.net/og-image.png" />
    <meta property="og:site_name" content="Bitcoinvestments" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bitcoinvestments | Learn Crypto Investing for Beginners" />
    <meta name="twitter:description" content="Learn to invest in Bitcoin and crypto safely: plain-English guides, exchange and wallet comparisons, free calculators and a scam checker." />
    <meta name="twitter:image" content="https://bitcoinvestments.net/og-image.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#F7931A" />
    <meta name="msapplication-TileColor" content="#F7931A" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="dark" />

    <!-- JSON-LD: the two entities that are true on every page -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://bitcoinvestments.net/#organization",
      "name": "Bitcoinvestments",
      "url": "https://bitcoinvestments.net",
      "logo": {
        "@type": "ImageObject",
        "url": "https://bitcoinvestments.net/logo.png",
        "width": 512,
        "height": 512
      },
      "description": "Bitcoinvestments is an independent cryptocurrency education site for beginners: plain-English guides, exchange and wallet comparisons, free calculators and a crypto scam checker.",
      "contactPoint": [
        {
          "@type": "ContactPoint",
          "email": "support@bitcoinvestments.net",
          "contactType": "customer support",
          "availableLanguage": "English"
        }
      ],
      "knowsAbout": [
        "Bitcoin",
        "Cryptocurrency",
        "Blockchain Technology",
        "Dollar Cost Averaging",
        "Crypto Wallet Security",
        "Cryptocurrency Exchanges",
        "Crypto Scam Prevention",
        "Cryptocurrency Taxes"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://bitcoinvestments.net/#website",
      "name": "Bitcoinvestments",
      "url": "https://bitcoinvestments.net",
      "publisher": { "@id": "https://bitcoinvestments.net/#organization" },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://bitcoinvestments.net/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <!-- Accessible noscript fallback (prerendered pages carry their full content in #root) -->
    <noscript>
      <div style="padding: 2rem; text-align: center; background: #1a1a2e; color: #fff;">
        <p style="color: #d1d5db; max-width: 480px; margin: 0 auto;">
          Our calculators, live prices and search need JavaScript. Articles and guides can be read without it:
          <a href="/learn" style="color: #f7931a;">guides</a>,
          <a href="/glossary" style="color: #f7931a;">glossary</a>,
          <a href="/compare" style="color: #f7931a;">exchange and wallet comparisons</a>,
          <a href="/scam-database" style="color: #f7931a;">scam checker</a>.
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for PWA functionality
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .catch(() => { /* offline support is optional */ });
        });
      }
    </script>
  </body>
</html>
