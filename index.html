<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bitcoinvestments" />

    <!-- Primary Meta Tags -->
    <title>Bitcoinvestments | Learn Crypto Investing for Beginners</title>
    <meta name="title" content="Bitcoinvestments | Learn Crypto Investing for Beginners" />
    <meta name="description" content="Learn how to invest in Bitcoin and cryptocurrency safely. Compare exchanges, wallets, and get educational guides for beginners. Free DCA calculators and portfolio tracking." />
    <meta name="keywords" content="Bitcoin, cryptocurrency, crypto investment, DCA, dollar cost averaging, crypto education, exchange comparison, wallet comparison, Bitcoin guide, cryptocurrency for beginners" />
    <meta name="author" content="Bitcoinvestments" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bitcoinvestments.com/" />
    <meta property="og:title" content="Bitcoinvestments | Learn Crypto Investing for Beginners" />
    <meta property="og:description" content="Learn how to invest in Bitcoin and cryptocurrency safely. Compare exchanges, wallets, and get educational guides for beginners." />
    <meta property="og:image" content="https://bitcoinvestments.com/og-image.png" />
    <meta property="og:site_name" content="Bitcoinvestments" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://bitcoinvestments.com/" />
    <meta name="twitter:title" content="Bitcoinvestments | Learn Crypto Investing for Beginners" />
    <meta name="twitter:description" content="Learn how to invest in Bitcoin and cryptocurrency safely. Compare exchanges, wallets, and get educational guides for beginners." />
    <meta name="twitter:image" content="https://bitcoinvestments.com/og-image.png" />
    <meta name="twitter:site" content="@bitcoinvestments" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://bitcoinvestments.com/" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#F7931A" />
    <meta name="msapplication-TileColor" content="#F7931A" />

    <!-- JSON-LD Organization Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Bitcoinvestments",
      "url": "https://bitcoinvestments.com",
      "logo": "https://bitcoinvestments.com/logo.png",
      "sameAs": [
        "https://twitter.com/bitcoinvestments"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "support@bitcoinvestments.com",
        "contactType": "customer support"
      }
    }
    </script>

    <!-- JSON-LD Website Schema with Search Action -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Bitcoinvestments",
      "url": "https://bitcoinvestments.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://bitcoinvestments.com/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for PWA functionality
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered:', registration.scope);
            })
            .catch((error) => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
